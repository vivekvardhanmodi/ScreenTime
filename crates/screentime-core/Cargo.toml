[package]
name = "screentime-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
