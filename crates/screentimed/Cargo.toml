[package]
name = "screentimed"
version = "0.1.0"
edition = "2021"

[dependencies]
screentime-core = { path = "../screentime-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
